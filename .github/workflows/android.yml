name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Fallback to bundled Android SDK
        run: |
          # 如果 setup-android 失败或 SDK 未就位，用 runner 自带的 cmdline-tools 继续
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" ]; then
            echo "使用 bundled cmdline-tools: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -d "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" ]; then
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -d "/usr/lib/android-sdk/cmdline-tools/latest/bin" ]; then
            export ANDROID_SDK_ROOT=/usr/lib/android-sdk
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            echo "尝试自动下载 cmdline-tools..."
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/
            sudo mkdir -p /usr/local/lib/android/sdk/cmdline-tools/latest
            sudo mv /tmp/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          set -x
          yes | sdkmanager --licenses 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 \
            || sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 \
            || echo "SDK 包安装失败，使用已有版本..."

      - name: Set up Gradle 8.5
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Decode signing key
        run: echo "$SIGNING_KEY" | base64 -d > android/app/echolink.p12
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_FILE: echolink.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_HOME: $ANDROID_SDK_ROOT
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK for release
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/EchoLink_Android_v1.0.0.apk
          ls -lh dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/EchoLink_Android_v1.0.0.apk

      - name: Upload APK to unified Release
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if gh release upload v1.0.0 dist/EchoLink_Android_v1.0.0.apk --clobber; then
              echo "APK upload ok"; break
            fi
            echo "attempt $i: gh release upload failed (likely 503), retry in 25s..."; sleep 25
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
