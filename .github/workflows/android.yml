name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.5
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Decode signing key
        run: echo "$SIGNING_KEY" | base64 -d > android/app/echolink.p12
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_FILE: echolink.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK for release
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/EchoLink_Android_v1.0.0.apk
          ls -lh dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/EchoLink_Android_v1.0.0.apk

      - name: Upload APK to unified Release
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if gh release upload v1.0.0 dist/EchoLink_Android_v1.0.0.apk --clobber; then
              echo "APK upload ok"; break
            fi
            echo "attempt $i: gh release upload failed (likely 503), retry in 25s..."; sleep 25
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
