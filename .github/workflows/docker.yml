name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/echolink-server:latest

      - name: Save image as offline package
        run: |
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/echolink-server:latest | gzip > echolink-server-image.tar.gz
          ls -lh echolink-server-image.tar.gz

      - name: Upload server image to unified Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: EchoLink v1.0.0
          overwrite_files: true
          files: echolink-server-image.tar.gz
        env:
          GITHUB_TOKEN=***REDACTED*** secrets.GITHUB_TOKEN }}
