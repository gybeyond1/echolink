name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/echolink-server:latest

      - name: Save image as offline package
        run: |
          docker save ${{ secrets.DOCKERHUB_USERNAME }}/echolink-server:latest | gzip > echolink-server-image.tar.gz
          ls -lh echolink-server-image.tar.gz

      - name: Upload server image to unified Release
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if gh release upload v1.0.0 echolink-server-image.tar.gz --clobber; then
              echo "image tarball upload ok"; break
            fi
            echo "attempt $i: gh release upload failed (likely 503), retry in 25s..."; sleep 25
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
