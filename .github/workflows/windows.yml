name: Build Windows Desktop (Tauri)

on:
  push:
    branches: ["main"]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows/NotifySync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/NotifySync/src-tauri/target
          key: ${{ runner.os }}-cargo-echolink-${{ hashFiles('windows/NotifySync/src-tauri/Cargo.lock', 'windows/NotifySync/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-echolink-

      - name: Install Tauri CLI
        run: npm install

      - name: Build release (NSIS only)
        env:
          NOTIFYSYNC_SERVER: https://ntfy.225600.xyz:1314
        run: npx tauri build --bundles nsis

      - name: Locate bundle output
        id: locate
        shell: bash
        run: |
          ls -la src-tauri/target/release/bundle/ 2>&1 | head
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -v src-tauri/target/release/bundle/nsis/*.exe "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/out/"

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoLink-Desktop-Windows
          path: out/*

      - name: Upload installer to unified Release
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: EchoLink v1.0.0
          overwrite_files: true
          files: |
            ${{ github.workspace }}/out/*.exe
        env:
          GITHUB_TOKEN=***REDACTED*** secrets.GITHUB_TOKEN }}
