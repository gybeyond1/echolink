<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>EchoLink · 应用过滤设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f4f8; color: #1B1B22; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #3390EC; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 10; }
    .header h1 { font-size: 17px; font-weight: 600; flex: 1; }
    .btn { padding: 7px 14px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; transition: opacity .2s; }
    .btn:active { opacity: .8; }
    .btn-back { background: rgba(255,255,255,.2); color: #fff; }
    .btn-back:hover { background: rgba(255,255,255,.3); }
    .btn-save { background: #fff; color: #3390EC; font-weight: 600; }
    .btn-save:hover { background: #f0f6ff; }
    .search-bar { padding: 10px 16px; background: #fff; border-bottom: 1px solid #e0e0e6; }
    .search-bar input { width: 100%; padding: 9px 14px; border: 1.5px solid #e0e0e6; border-radius: 10px;
      font-size: 14px; outline: none; transition: border-color .2s; }
    .search-bar input:focus { border-color: #3390EC; }
    .info-bar { padding: 8px 20px; background: #fff; border-bottom: 1px solid #e0e0e6; font-size: 12px; color: #8A8A93; }
    .list { flex: 1; overflow-y: auto; padding: 4px 0; }
    .item { display: flex; align-items: center; gap: 12px; padding: 9px 20px; cursor: pointer; transition: background .15s; }
    .item:hover { background: #ececf0; }
    .item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #3390EC; cursor: pointer; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-exe { font-size: 12px; color: #8A8A93; margin-top: 2px; }
    .empty { text-align: center; padding: 50px 20px; color: #8A8A93; font-size: 14px; }
    .loading { text-align: center; padding: 50px 20px; color: #8A8A93; font-size: 14px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: #1B1B22; color: #fff; padding: 10px 22px; border-radius: 10px; font-size: 14px;
      opacity: 0; transition: all .3s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="header">
    <button class="btn btn-back" onclick="goBack()">&#8592; 返回</button>
    <h1>应用过滤设置</h1>
    <button class="btn btn-save" onclick="save()">保存</button>
  </div>
  <div class="search-bar">
    <input id="search" type="text" placeholder="搜索应用名称或 exe…" oninput="renderList()" />
  </div>
  <div class="info-bar" id="infoBar">勾选要屏蔽通知的应用，未勾选的应用通知将正常同步。</div>
  <div id="list" class="list">
    <div class="loading">正在读取已安装应用…</div>
  </div>
  <div id="toast" class="toast"></div>
  <script>
    var allApps = [];
    var blockedSet = {};

    if (window.__TAURI__ && window.__TAURI__.core) {
      Promise.all([
        window.__TAURI__.core.invoke('get_config'),
        window.__TAURI__.core.invoke('list_installed_apps')
      ]).then(function(results) {
        var config = results[0];
        (config.blocked_apps || []).forEach(function(exe) { blockedSet[exe.toLowerCase()] = true; });
        allApps = results[1] || [];
        document.getElementById('infoBar').textContent =
          '共 ' + allApps.length + ' 个应用，已屏蔽 ' + Object.keys(blockedSet).length + ' 个。勾选要屏蔽通知的应用。';
        renderList();
      }).catch(function(e) {
        document.getElementById('list').innerHTML = '<div class="empty">读取应用列表失败: ' + escapeHtml(String(e)) + '</div>';
      });
    } else {
      document.getElementById('list').innerHTML = '<div class="empty">此功能仅在 EchoLink 桌面端可用</div>';
    }

    function renderList() {
      var search = document.getElementById('search').value.toLowerCase();
      var filtered = allApps.filter(function(app) {
        if (!search) return true;
        return app.name.toLowerCase().indexOf(search) >= 0 || app.exe.toLowerCase().indexOf(search) >= 0;
      });

      if (filtered.length === 0) {
        document.getElementById('list').innerHTML = '<div class="empty">没有找到匹配的应用</div>';
        return;
      }

      var html = filtered.map(function(app) {
        var checked = blockedSet[app.exe.toLowerCase()] ? 'checked' : '';
        return '<label class="item">' +
          '<input type="checkbox" data-exe="' + escapeAttr(app.exe) + '" ' + checked + ' />' +
          '<div class="item-info">' +
            '<div class="item-name">' + escapeHtml(app.name) + '</div>' +
            '<div class="item-exe">' + escapeHtml(app.exe) + '</div>' +
          '</div>' +
        '</label>';
      }).join('');
      document.getElementById('list').innerHTML = html;
    }

    function save() {
      var checkboxes = document.querySelectorAll('#list input[type="checkbox"]:checked');
      var apps = Array.prototype.map.call(checkboxes, function(cb) { return cb.dataset.exe; });
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('set_blocked_apps', { apps: apps }).then(function() {
          blockedSet = {};
          apps.forEach(function(exe) { blockedSet[exe.toLowerCase()] = true; });
          showToast('已保存，共屏蔽 ' + apps.length + ' 个应用');
        }).catch(function(e) {
          showToast('保存失败: ' + e);
        });
      }
    }

    function goBack() {
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke('get_config').then(function(config) {
          if (config.server_url) {
            window.location.replace(config.server_url);
          } else {
            window.location.replace('http://tauri.localhost/index.html');
          }
        }).catch(function() {
          window.location.replace('http://tauri.localhost/index.html');
        });
      }
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
