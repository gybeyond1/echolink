<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EchoLink</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // 主题预加载（防闪烁）：localStorage 优先，否则跟随系统
    (function () {
      try {
        var t = localStorage.getItem("ns_theme") || "system";
        var dark = t === "dark" ||
          (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-mode", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <style>
    /* 首次启动 / 切换服务器的地址输入页（已配置则隐藏） */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    #setup { position: fixed; inset: 0; z-index: 999; display: none;
      align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #2AABEE 0%, #3390EC 100%); color: #fff; }
    #setup.show { display: flex; }
    .box { text-align: center; max-width: 380px; width: 90%; }
    .logo { width: 72px; height: 72px; margin: 0 auto 20px;
      background: rgba(255,255,255,.22); border-radius: 18px; font-size: 42px; font-weight: 800;
      line-height: 72px; }
    h2 { margin: 0 0 6px; font-size: 26px; }
    .sub { margin: 0 0 28px; opacity: .88; font-size: 14px; }
    input { width: 100%; padding: 12px 16px; border: none; border-radius: 10px;
      font-size: 15px; outline: none; background: rgba(255,255,255,.18); color: #fff;
      border: 1.5px solid rgba(255,255,255,.25); transition: border-color .2s; }
    input::placeholder { color: rgba(255,255,255,.6); }
    input:focus { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.12); }
    button { width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer; background: #fff; color: #2AABEE;
      transition: transform .1s, opacity .2s; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .6; cursor: default; }
    .link { margin-top: 18px; font-size: 13px; opacity: .75; }
    .link a { color: #fff; text-decoration: underline; }
    .loading { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #ffddd2; font-size: 13px; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 服务器地址输入页（首次启动 / 托盘切换服务器时显示） -->
  <div id="setup" class="hidden">
    <div class="box">
      <div class="logo">E</div>
      <h2>EchoLink</h2>
      <p class="sub">跨设备消息互联平台</p>
      <input id="serverUrl" type="text" placeholder="https://your-server.com" autocomplete="off" />
      <button id="btnConnect">连接</button>
      <p id="error" class="err"></p>
      <p class="link"><a href="https://github.com/gybeyond1/echolink">github.com/gybeyond1/echolink</a></p>
    </div>
  </div>

  <!-- 主界面（本地 WebUI） -->
  <button id="themeToggle" class="theme-toggle" title="切换主题" aria-label="切换主题（浅色/深色/跟随系统）"></button>
  <div id="app"></div>
  <div id="toast"></div>

  <!-- 启动逻辑：已配置服务器 → 直接加载本地 UI；未配置 → 显示地址输入页 -->
  <script>
    (function () {
      var setupEl = document.getElementById("setup");
      var serverUrl = document.getElementById("serverUrl");
      var btnConnect = document.getElementById("btnConnect");
      var errEl = document.getElementById("error");

      function showSetup() {
        setupEl.classList.remove("hidden");
        setupEl.classList.add("show");
        serverUrl.focus();
      }

      function hideSetup() {
        setupEl.classList.add("hidden");
        setupEl.classList.remove("show");
      }

      // 禁用右键刷新 / 开发者工具 & F5 / Ctrl+R 刷新
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "F5" || (e.ctrlKey && (e.key === "r" || e.key === "R"))) e.preventDefault();
      });

      function startApp() {
        hideSetup();
        // 加载本地 WebUI（API 基址在 app.js 内通过 get_config 读取）
        var s = document.createElement("script");
        s.src = "app.js";
        document.body.appendChild(s);
      }

      function connectServer() {
        var url = serverUrl.value.trim().replace(/\/+$/, "");
        errEl.textContent = "";
        if (!url) { errEl.textContent = "请输入服务器地址"; return; }
        if (!/^https?:\/\//.test(url)) { url = "http://" + url; }

        btnConnect.disabled = true;
        btnConnect.textContent = "连接中…";

        if (window.__TAURI__ && window.__TAURI__.core) {
          window.__TAURI__.core.invoke("save_server_url", { url: url })
            .then(function () {
              // 保存成功 → 重新加载本地 UI（不跳转远程）
              location.reload();
            })
            .catch(function (e) {
              btnConnect.disabled = false;
              btnConnect.textContent = "连接";
              errEl.textContent = "保存失败: " + e;
            });
        } else {
          // 非 Tauri 环境（浏览器调试）→ 当作同源 WebUI
          location.reload();
        }
      }

      btnConnect.onclick = connectServer;
      serverUrl.addEventListener("keydown", function (e) { if (e.key === "Enter") connectServer(); });

      // 判断是否已配置服务器
      if (window.__TAURI__ && window.__TAURI__.core) {
        window.__TAURI__.core.invoke("app_info")
          .then(function (info) {
            if (info.server_url && info.server_url.length > 0) {
              startApp();
            } else {
              showSetup();
            }
          })
          .catch(function () { showSetup(); });
      } else {
        // 非 Tauri 环境：浏览器直接打开 dist → 显示输入页（调试用）
        showSetup();
      }
    })();
  </script>
</body>
</html>
